name: Publish sandbox images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (sandbox-images-vX.Y.Z)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sandbox-images
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'exoharness/exo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ] && ! [[ "$RELEASE_TAG" =~ ^sandbox-images-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be sandbox-images-vX.Y.Z" >&2
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sandbox-image-publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: codex-sandbox
            context: exoharness/containers/codex-sandbox
            build_args: DEVBOX_TOOLS=false
          - image: codex-devbox
            context: exoharness/containers/codex-sandbox
            build_args: DEVBOX_TOOLS=true
          - image: claude-code-sandbox
            context: exoharness/containers/claude-code-sandbox
            build_args: ''
          - image: pi-sandbox
            context: exoharness/containers/pi-sandbox
            build_args: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/exoharness/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/exoharness/exo
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Show immutable image reference
        env:
          IMAGE: ghcr.io/exoharness/${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
