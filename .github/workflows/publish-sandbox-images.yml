name: Publish sandbox images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (sandbox-images-vX.Y.Z)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sandbox-images
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'exoharness/exo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ] && ! [[ "$RELEASE_TAG" =~ ^sandbox-images-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be sandbox-images-vX.Y.Z" >&2
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sandbox-image-publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: codex-sandbox
            context: exoharness/containers/codex-sandbox
            build_args: DEVBOX_TOOLS=false
          - image: codex-devbox
            context: exoharness/containers/codex-sandbox
            build_args: DEVBOX_TOOLS=true
          - image: claude-code-sandbox
            context: exoharness/containers/claude-code-sandbox
            build_args: ""
          - image: pi-sandbox
            context: exoharness/containers/pi-sandbox
            build_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/exoharness/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/exoharness/exo
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Show immutable image reference
        env:
          IMAGE: ghcr.io/exoharness/${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save default image digest
        if: matrix.image != 'codex-devbox'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p image-digests
          printf '%s\n' "$DIGEST" > "image-digests/$IMAGE.txt"

      - name: Upload default image digest
        if: matrix.image != 'codex-devbox'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-image-digest-${{ matrix.image }}
          path: image-digests/${{ matrix.image }}.txt
          if-no-files-found: error

  update-default-images:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sandbox-image-pin-update
    permissions:
      contents: read
    steps:
      - name: Create sandbox image pinning token
        id: image-pin-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SANDBOX_IMAGE_UPDATE_APP_ID }}
          private-key: ${{ secrets.SANDBOX_IMAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.image-pin-token.outputs.token }}

      - name: Ensure main still points to the released commit
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main advanced during publication; rerun the release from the new main commit" >&2
            exit 1
          fi

      - name: Download published image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sandbox-image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Update pinned image references
        run: python3 exoharness/containers/update-default-image-digests.py image-digests

      - name: Commit released image digests to main
        run: |
          if git diff --quiet; then
            echo "Default image digests are already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/executor/src/managed_agents/config.rs \
            crates/executor/src/managed_agents/tests.rs
          git commit -m "Pin managed agent sandbox images from release"
          git push origin HEAD:refs/heads/main
          echo "Updated [default image digests](https://github.com/exoharness/exo/commit/$(git rev-parse HEAD)) on main." >> "$GITHUB_STEP_SUMMARY"
