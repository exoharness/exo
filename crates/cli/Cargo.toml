[package]
name = "exo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
aws-agentcore = ["executor/aws-agentcore"]
firecracker = ["executor/firecracker"]

[[bin]]
name = "exo"
path = "src/main.rs"

[dependencies]
actix-web.workspace = true
reqwest.workspace = true
url.workspace = true
rmcp = { workspace = true, features = ["auth", "reqwest"] }
oauth2.workspace = true
futures.workspace = true
async-trait.workspace = true
exo-managed-agents = { path = "../managed-agents" }
anyhow.workspace = true
clap.workspace = true
cost = { path = "../cost" }
crossterm.workspace = true
executor = { path = "../executor" }
exo-mcp = { path = "../mcp" }
exoharness = { path = "../exoharness" }
lingua.workspace = true
ratatui.workspace = true
rustyline = "15.0.0"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
toml = "0.9"
shlex.workspace = true
tabwriter.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bytes.workspace = true
exoharness = { path = "../exoharness", features = [
  "basic-backend",
  "contract-tests",
] }
futures.workspace = true
tempfile = "3.23.0"
wiremock = "0.6"
