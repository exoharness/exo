[package]
name = "exo-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["client"]
client = [
  "dep:reqwest",
  "rmcp/client",
  "rmcp/auth",
  "rmcp/transport-streamable-http-client-reqwest",
  "dep:sse-stream",
  "dep:tokio",
]

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
futures.workspace = true
# rmcp's HTTP client trait requires reqwest 0.13.
reqwest = { version = "0.13.2", optional = true, default-features = false, features = [
  "rustls",
  "json",
  "stream",
] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sse-stream = { version = "0.2", optional = true }
tokio = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
axum = "0.8"
