[package]
name = "executor"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
smolvm = ["exoharness/smolvm"]
aws-agentcore = ["exoharness/aws-agentcore"]
firecracker = ["exoharness/firecracker"]

[dependencies]
anyhow.workspace = true
actix-web.workspace = true
async-trait.workspace = true
base64 = "0.22.1"
boa_engine = "0.20.0"
braintrust-llm-router.workspace = true
braintrust-sdk-rust.workspace = true
bytes.workspace = true
chrono.workspace = true
cost = { path = "../cost" }
exo-mcp = { path = "../mcp" }
exo-managed-agents = { path = "../managed-agents" }
exoharness = { path = "../exoharness", features = [
  "apple-keychain",
  "basic-backend",
] }
futures.workspace = true
lingua.workspace = true
reqwest.workspace = true
openidconnect = "4.0.1"
oxide-auth = "0.6.1"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rsa = { version = "0.9", features = ["getrandom"] }
rmcp = { workspace = true, features = ["auth"] }
futures.workspace = true
tempfile = "3.23.0"
wiremock = "0.6"
