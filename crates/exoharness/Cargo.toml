[package]
name = "exoharness"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
smolvm = ["basic-backend", "dep:smolmachines"]
http-client = ["dep:reqwest"]
basic-backend = [
  "dep:libc",
  "dep:sha2",
  "dep:tokio-rustls",
  "dep:rcgen",
  "dep:hyper-util",
  "dep:hyper",
  "dep:http-body-util",
  "dep:hickory-proto",
  "http-client",
  "dep:aes-gcm",
  "dep:actix-web",
  "dep:base64",
  "dep:object_store",
  "dep:oauth2",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tokio-tungstenite",
  "dep:tokio-util",
  "dep:tracing",
  "dep:tempfile",
]
egress = ["basic-backend"]
firecracker = [
  "egress",
  "dep:docker_credential",
  "dep:exo-firecracker-protocol",
  "dep:flate2",
  "dep:ipnet",
  "dep:libc",
  "dep:oci-client",
  "dep:rustix",
  "dep:sha2",
  "dep:tar",
  "dep:tempfile",
  "dep:zstd",
]
apple-keychain = ["dep:keyring", "dep:keyring-core"]
aws-agentcore = [
  "basic-backend",
  "dep:aws-config",
  "dep:aws-credential-types",
  "dep:aws-sdk-bedrockagentcore",
]
contract-tests = []

[dependencies]
aes-gcm = { version = "0.11.0-rc.3", optional = true }
actix-web = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-bedrockagentcore = { workspace = true, optional = true }
base64 = { version = "0.22.1", optional = true }
bytes.workspace = true
chrono.workspace = true
docker_credential = { workspace = true, optional = true }
exo-firecracker-protocol = { path = "../firecracker-protocol", optional = true }
flate2 = { workspace = true, optional = true, features = ["zlib-rs"] }
futures.workspace = true
hickory-proto = { version = "0.25.2", default-features = false, optional = true }
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.8.1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.20", features = ["tokio"], optional = true }
ipnet = { workspace = true, optional = true }
keyring = { version = "4.0.0-rc.3", optional = true }
keyring-core = { version = "0.7.2", optional = true }
libc = { workspace = true, optional = true }
lingua.workspace = true
object_store = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
oci-client = { workspace = true, optional = true }
rcgen = { version = "0.14.7", optional = true }
reqwest = { workspace = true, optional = true }
rustix = { workspace = true, optional = true, features = ["fs"] }
semver = "1"
smolmachines = { version = "=1.17.0", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1.52.1", default-features = false, features = [
  "fs",
  "io-std",
  "io-util",
  "net",
  "process",
  "rt",
  "sync",
  "time",
], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "ring",
  "tls12",
], optional = true }
tokio-stream = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { workspace = true, optional = true, features = ["compat", "rt"] }
tracing = { workspace = true, optional = true }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7", "js"] }
zstd = { workspace = true, optional = true }

[dev-dependencies]
wiremock = "0.6"
sha2.workspace = true
tempfile = "3.23.0"
tokio = { version = "1.52.1", features = [
  "fs",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
  "test-util",
] }
tracing-subscriber.workspace = true

[[example]]
name = "firecracker-bridge"
required-features = ["firecracker"]
