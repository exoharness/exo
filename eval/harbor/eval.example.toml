# Flags passed to eval.sh override this file.
dataset = "terminal-bench"
# For a shorter run of three easy tasks, use "terminal-bench-easy".
model = "gpt-5.5"
n_tasks = 10
n_attempts = 1
# Trials at once. Must be 1 for the exo harness, whose trials share one
# self-evolving agent; basic and pi may go higher.
n_concurrent = 1

# Each task has its own conversation; agent memory and tools persist across tasks.
# "basic" uses the shell-only executor as a control; "exo" enables Exo tools;
# "pi" and "claude-code" run those coding agents inside the task container.
harness = "exo"

# A vendor CLI on the other vendor's model. Without base_url the eval runs a
# local translating gateway in front of the provider named by api_key_env:
# harness = "claude-code"
# model = "gpt-5.5"
# api_key_env = "OPENAI_API_KEY"
# or
# harness = "codex"
# model = "claude-sonnet-4-6"
# api_key_env = "ANTHROPIC_API_KEY"
