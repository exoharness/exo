[project]
name = "exo-harbor"
version = "0.1.0"
description = "Run Exo as a Harbor external agent"
requires-python = ">=3.12"
dependencies = [
  # The integration uses the external-agent and JobPlugin surface plus the
  # ATIF trajectory models. ExoAgent declares an options_model, a hook that
  # first shipped in 0.23.
  "harbor>=0.23",
  # The model gateway (exo_harbor.gateway) is LiteLLM's proxy. Its extra pins
  # rich<14 against harbor's rich>=14.1 for no reason that survives testing
  # (rich is only used by litellm's admin CLI); overrides.txt lifts the pin and
  # https://github.com/BerriAI/litellm/pull/42322 asks upstream to. Pinned to
  # the version the Messages and Responses translation was verified against.
  "litellm[proxy]==1.101.0",
]

[project.entry-points."harbor.plugins"]
# Lets runs say `--plugin exo-session` instead of the full import path.
exo-session = "exo_harbor.plugin:ExoSessionPlugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
